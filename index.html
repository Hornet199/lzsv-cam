<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Kamera LZSV – Spišská Nová Ves</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; padding: 15px; }
    .box { max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; color: #38bdf8; }
    img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid #334155; }
    .meta { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>LETISKO SPIŠSKÁ NOVÁ VES (LZSV) – LIVE WEBCAM</h1>
    <img id="cam" src="https://raw.githubusercontent.com/Hornet199/lzsv-cam/main/webcam.jpg" alt="Načítavam snímku z kamery LZSV...">
    <div class="meta" id="info">Automatická aktualizácia každých 30 sekúnd...</div>
  </div>
  <script>
    function obnovObrazok() {
      const img = new Image();
      const ts = new Date().getTime();
      // Priame načítanie zo surového repozitára (obchádza 37s build a limity GitHub Pages)
      const rawUrl = 'https://raw.githubusercontent.com/Hornet199/lzsv-cam/main/webcam.jpg?t=' + ts;
      img.onload = function() {
        document.getElementById('cam').src = this.src;
        document.getElementById('info').innerText = 'Posledná aktualizácia obrazu: ' + new Date().toLocaleTimeString('sk-SK');
      };
      img.src = rawUrl;
    }
    setInterval(obnovObrazok, 30000);
    obnovObrazok();
  </script>
</body>
</html>
