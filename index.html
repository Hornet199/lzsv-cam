<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live kamera LZSV – Letisko Spišská Nová Ves</title>
  <style>
    body { margin: 0; background: #0b1120; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
    img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
    .meta { margin-top: 10px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Live kamera LZSV – Spišská Nová Ves</h2>
    <img id="camImage" src="webcam.jpg" alt="LZSV Live Cam">
    <div class="meta" id="statusText">Automatická aktualizácia každých 30 sekúnd...</div>
  </div>
  <script>
    function refreshCamera() {
      const nextImg = new Image();
      const bust = Date.now();
      nextImg.onload = function() {
        document.getElementById('camImage').src = this.src;
        document.getElementById('statusText').textContent = 'Posledná kontrola snímky: ' + new Date().toLocaleTimeString('sk-SK');
      };
      nextImg.src = 'webcam.jpg?t=' + bust;
    }
    setInterval(refreshCamera, 30000);
    refreshCamera();
  </script>
</body>
</html>
